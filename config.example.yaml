# 只用其中一个服务器时，把另一个写成 null（如 emby: null），此时每个映射都要填写 trakt_user，只与 Trakt 同步
plex:
  url: http://192.168.1.10:32400
  token: your-plex-token          # 服务器所有者的 X-Plex-Token

emby:
  url: http://192.168.1.11:8096
  api_key: your-emby-api-key      # Emby 后台 -> 高级 -> API 密钥

mappings:
  # plex_user 留空表示 Plex 服务器所有者（你自己）
  - plex_user:
    emby_user: your-emby-username # Emby 用户名或用户 Id
    trakt_user:                   # 可选：在 Web 页面授权后的 Trakt 用户名，留空不推送到 Trakt

trakt:                            # 可选：自建 Trakt App，Redirect URI 填 urn:ietf:wg:oauth:2.0:oob
  client_id:
  client_secret:                  # 可选：新建的 App 不再提供 Secret（显示 Not issued），留空即可
  scrobble: true                  # 实时推送播放进度到 Trakt
  sync_marks: true                # 在 Plex / Emby 中标记已看 / 清除进度时，实时同步到 Trakt
  sync_unwatch: false             # 把已看的条目标记为未看时，删除 Trakt 上的全部观看记录（删除前备份到 data/trakt_removed.jsonl）
  unwatch_max: 10                 # 1 小时内标记未看的电影 / 剧超过此数量时暂停删除，在 Web 页面确认
  push_interval: 0                # 定时全量同步到 Trakt 的间隔（小时），0 表示只在 Web 页面手动执行
  pull_interval: 0                # 定时从 Trakt 全量同步的间隔（小时），0 表示只在 Web 页面手动执行

sync:
  reconcile_interval: 900         # 定时对账间隔（秒）
  progress_interval: 60           # 播放中推送进度的最小间隔（秒）
  echo_window: 10                 # 写入后忽略回传事件的时间窗口（秒）
  dry_run: true                   # 首次运行建议开启，确认日志无误后改为 false（也可在 Web 页面中配置）

db_path: data/state.db
log_level: INFO
